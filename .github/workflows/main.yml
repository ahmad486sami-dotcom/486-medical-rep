name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project MedRep486.xcodeproj \
            -scheme MedRep486 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MedRep486.app Payload/
          zip -qry 486MedicalRep.ipa Payload

      - name: Publish IPA as a release (direct download link for ESign)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" 486MedicalRep.ipa \
            --title "486 Medical Rep - build ${{ github.run_number }}" \
            --notes "Unsigned IPA. Open the .ipa link in ESign (Downloads > paste link), then sign and install."
